name: EduQuest settings crash test (temporary)

on:
  push:
    branches: [ ci-eduquest-debug ]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install -y
          build-essential ninja-build gdb xvfb
          libfreetype-dev libgles2-mesa-dev libsdl3-dev libpng-dev
          librtmidi-dev libopenal-dev libslirp-dev libfluidsynth-dev
          libvdeplug-dev libserialport-dev libzstd-dev libsndfile1-dev
          qtbase5-dev qtbase5-private-dev qttools5-dev qttranslations5-l10n
          libevdev-dev libxkbcommon-x11-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Debug -D QT=on -D USE_QT6=off -D DISCORD=off -D LIBRASHADER=off

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build 2>&1 | tee build.log; then
            msg=$(grep -E "error|FAILED" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=build::$msg"
            exit 1
          fi

      - name: Prepare VMs (placeholder ROM files only)
        run: |
          for d in vm_open vm_select; do
            mkdir -p $d/roms/machines/eduquest30
            for f in A386_101_06A.BIN ROM_DOS_01.BIN ROM_DISK_01a.BIN; do
              head -c 131072 /dev/zero > $d/roms/machines/eduquest30/$f
            done
          done
          # Placeholder files for every ROM path in the source, so every machine
          # is "available" like with a full ROM set.
          grep -rhoE '"roms/[^"]+"' src | tr -d '"' | sort -u | grep -v '%' | grep -v '/$' | while read -r f; do
            mkdir -p "vm_select/$(dirname "$f")" 2>/dev/null || continue
            [ -e "vm_select/$f" ] || head -c 131072 /dev/zero > "vm_select/$f" 2>/dev/null || true
          done; true
          printf "[Machine]\nmachine = eduquest30\n" > vm_open/86box.cfg
          : > vm_select/86box.cfg

      - name: "Test 1: open Settings with EduQuest already selected, then OK"
        continue-on-error: true
        run: |
          EQ_ACCEPT=1 QT_QPA_PLATFORM=offscreen timeout 300 gdb -q -batch -ex run -ex bt -ex "thread apply all bt 8" \
            --args build/src/86Box -S -N -P "$PWD/vm_open" -R "$PWD/vm_open/roms" 2>&1 | grep -v "^\[New Thread\|^\[Thread" | tail -150 > t1.log
          echo "---- saved config ----" >> t1.log; cat vm_open/86box.cfg >> t1.log || true
          cat t1.log
          echo "::notice title=test1::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' t1.log)"

      - name: "Test 2: fresh VM, select EduQuest in Settings, then OK (VM manager flow)"
        continue-on-error: true
        run: |
          EQ_SELECT=eduquest30 EQ_ACCEPT=1 QT_QPA_PLATFORM=offscreen timeout 300 gdb -q -batch -ex run -ex bt -ex "thread apply all bt 8" \
            --args build/src/86Box -S -N -P "$PWD/vm_select" -R "$PWD/vm_select/roms" 2>&1 | grep -v "^\[New Thread\|^\[Thread" | tail -150 > t2.log
          echo "---- saved config ----" >> t2.log; cat vm_select/86box.cfg >> t2.log || true
          cat t2.log
          echo "::notice title=test2::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' t2.log)"

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          release: true
          pacboy: >-
            ninja:p cmake:p gcc:p pkgconf:p freetype:p sdl3:p zlib:p libpng:p
            openal:p rtmidi:p libslirp:p fluidsynth:p libserialport:p
            qt5-static:p llvm-openmp:p zstd:p gdb:p
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build --preset dev_debug -D QT=on
      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build 2>&1 | tee build.log; then
            msg=$(grep -E "error|FAILED" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=winbuild::$msg"
            exit 1
          fi
      - name: Prepare VMs
        run: |
          grep -rhoE '"roms/[^"]+"' src | tr -d '"' | sort -u | grep -v '%' | grep -v '/$' | while read -r f; do
            mkdir -p "vm_select/$(dirname "$f")" 2>/dev/null || continue
            [ -e "vm_select/$f" ] || head -c 131072 /dev/zero > "vm_select/$f" 2>/dev/null || true
          done; true
          mkdir -p vm_open/roms/machines/eduquest30
          for f in A386_101_06A.BIN ROM_DOS_01.BIN ROM_DISK_01a.BIN; do head -c 131072 /dev/zero > vm_open/roms/machines/eduquest30/$f; done
          printf "[Machine]\nmachine = eduquest30\n" > vm_open/86box.cfg
          : > vm_select/86box.cfg
      - name: "Win test 1: open Settings with EduQuest, OK"
        continue-on-error: true
        run: |
          EQ_ACCEPT=1 QT_QPA_PLATFORM=offscreen timeout 300 gdb -q -batch -ex run -ex bt \
            --args build/src/86Box.exe -S -N -P "$(cygpath -w $PWD/vm_open)" -R "$(cygpath -w $PWD/vm_open/roms)" 2>&1 | grep -v "^\[New Thread\|^\[Thread" | tail -60 > w1.log
          echo "---- saved config ----" >> w1.log; cat vm_open/86box.cfg >> w1.log || true
          cat w1.log
          echo "::notice title=win1::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' w1.log)"
      - name: "Win test 2: fresh VM, select EduQuest, OK"
        continue-on-error: true
        run: |
          EQ_SELECT=eduquest30 EQ_ACCEPT=1 QT_QPA_PLATFORM=offscreen timeout 300 gdb -q -batch -ex run -ex bt \
            --args build/src/86Box.exe -S -N -P "$(cygpath -w $PWD/vm_select)" -R "$(cygpath -w $PWD/vm_select/roms)" 2>&1 | grep -v "^\[New Thread\|^\[Thread" | tail -60 > w2.log
          echo "---- saved config ----" >> w2.log; cat vm_select/86box.cfg >> w2.log || true
          cat w2.log
          echo "::notice title=win2::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' w2.log)"
